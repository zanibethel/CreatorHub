name: Clipper PostgreSQL acceptance

on:
  pull_request:
    paths:
      - "src/app/api/clipper/youtube/**"
      - "supabase/migrations/*clipper*youtube*.sql"
      - "tests/clipper-postgres-integration.test.mjs"
      - "tests/fixtures/clipper-postgres-bootstrap.sql"
      - ".github/workflows/clipper-postgres-acceptance.yml"

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: clipper_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clipper_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure psql client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Run real PostgreSQL quota and RLS tests
        env:
          CLIPPER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clipper_ci
        run: node --test tests/clipper-postgres-integration.test.mjs
