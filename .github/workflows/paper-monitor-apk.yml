name: Galaxy PAPER Monitor APK
on:
  pull_request:
    paths:
      - "android/paper-broker-monitor/**"
      - ".github/workflows/paper-monitor-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/paper-broker-monitor/**"
      - ".github/workflows/paper-monitor-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 build SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and sign test APK
        run: gradle -p android/paper-broker-monitor --no-daemon --stacktrace assembleDebug
      - name: Confirm APK exists
        run: |
          test -s android/paper-broker-monitor/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/paper-broker-monitor/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorHub-PAPER-Monitor-Android-APK
          path: android/paper-broker-monitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
