name: Galaxy PAPER Monitor APK
on:
  pull_request:
    paths:
      - "android/paper-broker-monitor/**"
      - ".github/workflows/paper-monitor-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/paper-broker-monitor/**"
      - ".github/workflows/paper-monitor-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners already include Android command-line SDK tools.
      # setup-android@v3 currently fails trying to install removed SDK "tools".
      - name: Install Android 35 build SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and sign test APK
        run: gradle -p android/paper-broker-monitor --no-daemon --stacktrace assembleDebug
      - name: Confirm APK exists
        run: |
          test -s android/paper-broker-monitor/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/paper-broker-monitor/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorHub-PAPER-Monitor-Android-APK
          path: android/paper-broker-monitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish one-time direct-download alpha APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Do not silently replace the original test-signing identity.
          # Replacing an Android APK with another debug signature can require
          # uninstalling the app, which would erase buffered broker events.
          if gh release view galaxy-paper-monitor-alpha >/dev/null 2>&1; then
            echo "Alpha release already exists; preserving its original signing identity."
          else
            cp android/paper-broker-monitor/app/build/outputs/apk/debug/app-debug.apk CreatorHub-PAPER-Monitor-alpha.apk
            gh release create galaxy-paper-monitor-alpha CreatorHub-PAPER-Monitor-alpha.apk \
              --target "$GITHUB_SHA" \
              --title "CreatorHub PAPER Monitor - Android alpha" \
              --notes "Standalone PAPER-only broker-monitor companion for Samsung Galaxy. Development-signed alpha APK; NOT validated on device, not connected to Supabase until dedicated ingestion token SHA-256 is configured. Installing does not enable trading. Never uninstall while broker events are awaiting delivery." \
              --prerelease
          fi
